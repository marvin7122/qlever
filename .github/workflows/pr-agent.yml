name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

# PR-Agent only reads PR data through the GitHub API; do not check out PR code.
# This deliberately supports same-repository PRs only. External-fork PRs do
# not receive an LLM review because pull_request events withhold repository
# secrets from them.
permissions: {}

# Separate groups per event type so that a maintainer command does not cancel
# an automatic review that is still running for the same PR.
concurrency:
  group: pr-agent-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  pr_agent:
    name: PR-Agent review
    # `contents: read` lets PR-Agent fetch file contents through the API.
    permissions:
      contents: read
      pull-requests: write
      issues: write
    if: >-
      ${{ github.event.sender.type != 'Bot' &&
          ((github.event_name == 'pull_request' &&
            !github.event.pull_request.draft &&
            github.event.pull_request.head.repo.full_name == github.repository) ||
           (github.event_name == 'issue_comment' &&
            github.event.issue.pull_request &&
            github.event.issue.state == 'open' &&
            (startsWith(github.event.comment.body, '/review') ||
             startsWith(github.event.comment.body, '/describe') ||
             startsWith(github.event.comment.body, '/improve') ||
             startsWith(github.event.comment.body, '/ask')) &&
            contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
                     github.event.comment.author_association))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # issue_comment events do not carry the PR head repository, so check it
      # through the API: commands on fork PRs must not send fork content to
      # the LLM with this repository's credentials.
      - name: Check that the PR comes from this repository
        id: same-repo
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          head_repo=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.repo.full_name // ""')
          if [ "${head_repo}" = "${GITHUB_REPOSITORY}" ]; then
            echo "ok=true" >> "${GITHUB_OUTPUT}"
          else
            echo "PR head repository '${head_repo}' is not ${GITHUB_REPOSITORY}; skipping PR-Agent."
            echo "ok=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Run PR-Agent
        if: github.event_name == 'pull_request' || steps.same-repo.outputs.ok == 'true'
        uses: the-pr-agent/pr-agent@f3b385ea2927247ddcff2fe252472380b9c8f5fc # v0.45.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          config.model: deepseek/deepseek-reasoner
          config.fallback_models: '["deepseek/deepseek-chat"]'
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'
          pr_reviewer.require_tests_review: "true"
          pr_code_suggestions.num_code_suggestions: "5"
          pr_reviewer.extra_instructions: >-
            Review QLever C++ changes for correctness, lifetime and ownership,
            concurrency, performance regressions, API contracts, and test
            coverage. Prefer precise, actionable findings; do not apply or
            approve changes. Ignore generated files and do not comment merely
            on style when the code is otherwise clear.
