name: OpenCodeReview (fan-out project rules)

on:
  # Minimal PR profile 2026-09-28: no pull_request_target trigger, so no
  # automatic review on PR pushes. Reviews run on demand only, via a
  # maintainer comment (see the job `if:` below).
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  # Comments that are not a review command (e.g. the bot's own result or error
  # comments) get a group of their own, so they cannot cancel a running review.
  group: >-
    ${{ github.event_name == 'issue_comment' &&
    !startsWith(github.event.comment.body, '/open-code-review-fanout') &&
    !startsWith(github.event.comment.body, '@open-code-review-fanout') &&
    format('ocr-fanout-project-rules-ignored-{0}', github.run_id) ||
    format('ocr-fanout-project-rules-{0}', github.event.pull_request.number ||
    github.event.issue.number || github.run_id) }}
  cancel-in-progress: true

jobs:
  review-fanout-project-rules:
    if: >-
      (github.event.issue.pull_request &&
       github.event.comment.user.type != 'Bot' &&
       (github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'COLLABORATOR') &&
       (startsWith(github.event.comment.body, '/open-code-review-fanout') ||
        startsWith(github.event.comment.body, '@open-code-review-fanout')))
    # GitHub-hosted: this job is LLM-API-bound, not CPU-bound, so it must
    # not occupy fleet compile runners (CI speedup 2026-09-24).
    runs-on: ubuntu-latest
    # Full fan-out project-rules reviews need ~3.5-4h on larger diffs: runs
    # 35110677564 and 35288058721 were both killed at exactly the old
    # 180 min limit while the review agent was still streaming progress.
    # 360 is the GitHub-hosted cap; large diffs may now time out where the
    # old 1800 min self-hosted limit survived. If that happens, split the
    # review (smaller diffs) rather than moving back to the fleet.
    timeout-minutes: 360
    env:
      # Path-independent build cache: the action checkout lands at a different
      # absolute path every run, which would defeat GOCACHE without this.
      GOFLAGS: -trimpath
    steps:
      - name: Resolve PR context for comment-triggered reviews
        id: pr-context
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('head_sha', pr.head.sha);
      - name: Isolate npm prefix for this run
        run: |
          prefix="${RUNNER_TEMP}/ocr-npm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${prefix}"
          echo "NPM_CONFIG_PREFIX=${prefix}" >> "$GITHUB_ENV"
          echo "OCR_NPM_PREFIX=${prefix}" >> "$GITHUB_ENV"
          echo "${prefix}/bin" >> "$GITHUB_PATH"
      # Hosted runners bring no Go toolchain: install the action's go.mod
      # minimum (1.25.5 at pin 34ed9d2; bump with the action pin).
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Restore OCR source-build caches
        # The fork's fan-out flag is not on npm, so the action must build from
        # source; cache the Go/npm caches keyed by the pinned OCR action
        # revision and the setup-go revision so only the first run per pin
        # pair pays the full build. A miss behaves exactly like today. Bump
        # the trailing SHAs when either pin below changes.
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.npm
          key: ocr-build-linux-x64-48cc191fc147f0b4642e9658717805f6a3dfefa5-40f1582b2485089dde7abd97c1529aa768e1baff
      # Comment-triggered runs belong to the default branch, so GitHub does not
      # list them among the PR's checks. A check run of the OCR app on the PR's
      # head commit makes the review visible there (falls back to a commit
      # status when the app token is unavailable or lacks `checks: write`).
      - name: Mint App token for the check run
        id: app-token-check
        if: ${{ vars.OCR_FANOUT_APP_ID != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.OCR_FANOUT_APP_ID }}
          private-key: ${{ secrets.OCR_FANOUT_APP_PRIVATE_KEY }}
          owner: marvin7122
          repositories: qlever
      - name: Start the check run on the PR commit
        id: check-start
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          APP_TOKEN: ${{ steps.app-token-check.outputs.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || steps.pr-context.outputs.head_sha }}
        with:
          script: |
            const sha = process.env.HEAD_SHA;
            if (!sha) return;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { owner, repo } = context.repo;
            if (process.env.APP_TOKEN) {
              try {
                const appClient = github.getOctokit(process.env.APP_TOKEN);
                const { data } = await appClient.rest.checks.create({
                  owner, repo, name: 'OCR fan-out review', head_sha: sha,
                  status: 'in_progress', details_url: runUrl,
                  output: { title: 'Review running', summary: `[Actions run](${runUrl})` },
                });
                core.setOutput('check_run_id', String(data.id));
                return;
              } catch (e) {
                core.warning(`checks.create failed (${e.status}); using a commit status`);
              }
            }
            await github.rest.repos.createCommitStatus({
              owner, repo, sha, state: 'pending', context: 'OCR fan-out review',
              description: 'Review running', target_url: runUrl,
            });
      - name: Review pull request with fan-out project rules
        id: ocr
        uses: marvin7122/open-code-review@34ed9d2925e550cf7edb97f3751c6cada6f89d9c
        with:
          # Deliberately the job-scoped GITHUB_TOKEN, not an App installation
          # token: installation tokens expire after 1 hour, but large-diff
          # reviews run for hours and must still post results at the end.
          github_token: ${{ github.token }}
          llm_url: ${{ vars.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ vars.OCR_LLM_MODEL }}
          llm_use_anthropic: ${{ vars.OCR_LLM_USE_ANTHROPIC }}
          # Meta's Model API (api.meta.ai) validates strictly against the
          # OpenAI schema and rejects the OCR default extra body
          # {"thinking": {"type": "disabled"}}, so send an empty object
          # (same override as ocr-review.yml).
          llm_extra_body: '{}'
          base_ref: ${{ steps.pr-context.outputs.base_ref }}
          head_sha: ${{ steps.pr-context.outputs.head_sha }}
          ocr_install_from: source
          fan_out_project_rules: 'true'
          rule: .opencodereview/rule.json
          review_concurrency: '1'
          effort: high
          sticky_summary: 'false'
          incremental: 'true'
          upload_artifacts: 'true'
          stream_progress: 'true'
      - name: Save OCR source-build caches
        # Runs even when the review is cancelled or times out (the common
        # case), so the next run still benefits. Conflicts with an existing
        # entry are harmless: the step may warn, the job continues.
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.npm
          key: ocr-build-linux-x64-48cc191fc147f0b4642e9658717805f6a3dfefa5-40f1582b2485089dde7abd97c1529aa768e1baff
      - name: Mint fresh App token for stamping
        id: app-token-stamp
        if: ${{ vars.OCR_FANOUT_APP_ID != '' }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          # Installation tokens expire after 1 hour; the review above can run
          # for hours, so the token minted at job start may be dead by now.
          app-id: ${{ vars.OCR_FANOUT_APP_ID }}
          private-key: ${{ secrets.OCR_FANOUT_APP_PRIVATE_KEY }}
          owner: marvin7122
          repositories: qlever
      - name: Stamp summary with Actions run URL
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          OCR_POSTER_LABEL: OCR fan-out
        with:
          github-token: ${{ github.token }}
          script: |
            const runId = context.runId;
            const attempt = context.runAttempt || 1;
            const marker = `<!-- ocr-summary-run:${runId}-${attempt} -->`;
            const linkMarker = '<!-- ocr-run-link -->';
            const label = process.env.OCR_POSTER_LABEL || 'OpenCodeReview';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;
            const number = context.payload.pull_request?.number || context.issue.number;
            if (!number) return;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              per_page: 100,
            });
            const stamp = `${linkMarker}\n**${label}** · [Actions run ${runId}](${runUrl})\n`;
            for (const c of comments) {
              const body = c.body || '';
              if (!body.includes(marker) || body.includes(linkMarker)) continue;
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: c.id,
                body: `${stamp}\n${body}`,
              });
            }
      - name: Mint App token to finish the check run
        id: app-token-finish
        if: ${{ always() && vars.OCR_FANOUT_APP_ID != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.OCR_FANOUT_APP_ID }}
          private-key: ${{ secrets.OCR_FANOUT_APP_PRIVATE_KEY }}
          owner: marvin7122
          repositories: qlever
      - name: Finish the check run on the PR commit
        if: always()
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          # Fresh token: the one minted at the start expires after one hour.
          APP_TOKEN: ${{ steps.app-token-finish.outputs.token }}
          CHECK_RUN_ID: ${{ steps.check-start.outputs.check_run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || steps.pr-context.outputs.head_sha }}
          JOB_STATUS: ${{ job.status }}
          COMMENTS_TOTAL: ${{ steps.ocr.outputs.comments_total }}
          COMMENTS_INLINE: ${{ steps.ocr.outputs.comments_inline }}
          COMMENTS_ROUTED: ${{ steps.ocr.outputs.comments_routed }}
          COMMENTS_FAILED: ${{ steps.ocr.outputs.comments_failed }}
          SUMMARY_URL: ${{ steps.ocr.outputs.summary_comment_url }}
        with:
          script: |
            const sha = process.env.HEAD_SHA;
            if (!sha) return;
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const status = process.env.JOB_STATUS;
            const ok = status === 'success';
            const n = (k) => process.env[k] || '0';
            const title = ok ? `${n('COMMENTS_TOTAL')} finding(s)` : `Review ${status}`;
            const summary = [
              `- Findings: ${n('COMMENTS_TOTAL')}`,
              `- Posted inline: ${n('COMMENTS_INLINE')}`,
              `- In the summary comment: ${n('COMMENTS_ROUTED')}`,
              `- Failed to post: ${n('COMMENTS_FAILED')}`,
              process.env.SUMMARY_URL ? `- [Summary comment](${process.env.SUMMARY_URL})` : '',
              `- [Actions run](${runUrl})`,
            ].filter(Boolean).join('\n');
            if (process.env.CHECK_RUN_ID && process.env.APP_TOKEN) {
              try {
                const appClient = github.getOctokit(process.env.APP_TOKEN);
                await appClient.rest.checks.update({
                  owner, repo, check_run_id: Number(process.env.CHECK_RUN_ID),
                  status: 'completed',
                  conclusion: ok ? 'success' : (status === 'cancelled' ? 'cancelled' : 'failure'),
                  output: { title, summary },
                });
                return;
              } catch (e) {
                core.warning(`checks.update failed (${e.status}); using a commit status`);
              }
            }
            await github.rest.repos.createCommitStatus({
              owner, repo, sha, state: ok ? 'success' : 'failure',
              context: 'OCR fan-out review', description: title, target_url: runUrl,
            });
      - name: Remove isolated npm prefix
        if: always()
        run: rm -rf "${OCR_NPM_PREFIX:?}"
