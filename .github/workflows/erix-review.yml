name: AI Code Review (Erix)

# Trial review job: Qwen 3 Coder via OpenRouter. Runs only on internal PRs
# (pull_request from forks carries no secrets, so external PRs skip safely).
# fail-on-blocking stays false until the trial proves itself.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

# One review per PR: a newer push cancels the stale run so comments
# always describe the current head.
concurrency:
  group: erix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Internal PRs only: fork runs carry no secrets, so Erix would
    # fail on an empty API key.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      # Pinned to main HEAD (no stable release tag published yet).
      - uses: ecodrix/erix_buddy@d624e90cc5691935b4fae7059bcb7a3191e7a792
        with:
          provider: openrouter
          api-key: ${{ secrets.OPENROUTER_API_KEY }}
          model: qwen/qwen3-coder-30b-a3b-instruct
          mode: branch
          branch: origin/${{ github.base_ref }}
          severity: minor
          fail-on-blocking: "false"
          post-pr-comment: "true"
