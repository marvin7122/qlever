# Usage:
# - Install pre-commit: `pip install pre-commit` (once).ci:
# - In the main directory of QLever run
#   - `pre-commit install` to use a package version of clang-format
#   - `pre-commit install -c .pre-commit-config-local.yaml` to use the local clang-format
# - Each git commit will now automatically be formatted. Note that
# - commits will fail if the hook reformats your files, so you
# - have to run git commit twice in order to first format and then
# - actually commit.
repos:
  # Uses a packaged version of clang-format from https://github.com/ssciwr/clang-format-wheel
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: 'v18.1.8'
    hooks:
      - id: clang-format
        'types_or': [ c++, c ]

  - repo: https://github.com/codespell-project/codespell
    # Configuration for codespell is in .codespellrc
    rev: v2.2.6
    hooks:
      - id: codespell

  # The deterministic style rules live (project-independently) in the
  # ocr-runners repository, together with the rule corpus they enforce;
  # this repo only invokes the checker. Override the location of that
  # checkout with OCR_RUNNERS_DIR if it is not at ~/code/ocr-runners.
  - repo: local
    hooks:
      - id: deterministic-rules
        name: deterministic style rules (CPP51/CPP73/CPP74/CPP75/QC64/QC65)
        entry: bash -c 'python3 "${OCR_RUNNERS_DIR:-$HOME/code/ocr-runners}/rules/tools/check-deterministic-rules.py" --staged'
        language: system
        'types_or': [ c++, c ]
        pass_filenames: false
