# See .pre-commit-config.yaml for usage instructions.
repos:
  # Uses the local clang-format
  - repo: local
    hooks:
      # Inspired by https://github.com/doublify/pre-commit-clang-format and
      # https://github.com/pre-commit/mirrors-clang-format
      - id: clang-format-18
        name: clang-format
        description: Format files with ClangFormat18.
        entry: clang-format-18 -i
        language: system
        'types_or': [ c++, c ]
        args: [ "-style=file" ]
        require_serial: false


  - repo: https://github.com/codespell-project/codespell
    # Configuration for codespell is in .codespellrc
    rev: v2.2.6
    hooks:
      - id: codespell

  # The deterministic style rules live (project-independently) in the
  # ocr-runners repository, together with the rule corpus they enforce;
  # this repo only invokes the checker. Override the location of that
  # checkout with OCR_RUNNERS_DIR if it is not at ~/code/ocr-runners.
  - repo: local
    hooks:
      - id: deterministic-rules
        name: deterministic style rules (CPP51/CPP73/CPP74/CPP75/QC64/QC65)
        entry: bash -c 'python3 "${OCR_RUNNERS_DIR:-$HOME/code/ocr-runners}/rules/tools/check-deterministic-rules.py" --staged'
        language: system
        'types_or': [ c++, c ]
        pass_filenames: false
